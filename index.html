<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repetytorium — egzamin dyplomowy ARiSS</title>
<link rel="icon" type="image/png" sizes="144x144" href="favicon-144.png?v=2">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="favicon-144.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1B2D; --mut:#5A667A; --line:#CDD5E2;
  --paper:#EEF1F6; --card:#FBFCFE;
  --teal:#2457D6; --amber:#E2711D; --violet:#7A4FD0; --rose:#D04C70; --sky:#4C7DF0;
  --disp:"Space Grotesk",system-ui,sans-serif;
  --body:"STIX Two Text","Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
     font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 22px 100px}

/* ---- nagłówek ---- */
header{padding:30px 0 30px;border-bottom:1px solid var(--line)}

/* ---- masthead z meowlami ---- */
.masthead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:0 36px;align-items:end;
          border-bottom:2px solid var(--ink);margin-bottom:26px}
.mh-text{padding-bottom:26px}
.mh-text .eyebrow{max-width:30em}
.mh-text h1{margin-bottom:0}
.mh-meowls{margin:0;line-height:0}
.mh-meowls img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(15,27,45,.16))}
@media (max-width:760px){
  .masthead{grid-template-columns:1fr}
  .mh-text{padding-bottom:20px}
  .mh-meowls{max-width:420px}
}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
         color:var(--mut);margin:0 0 14px}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(32px,5.4vw,50px);line-height:1.06;
   letter-spacing:-.025em;margin:0 0 18px}
.quest{font-style:italic;font-size:19px;margin:0;padding-left:16px;border-left:3px solid var(--violet)}
.src{font-family:var(--mono);font-size:12.5px;color:var(--mut);margin-top:18px}

/* ---- pasek stanu ---- */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin:26px 0 4px;
        font-family:var(--mono);font-size:12.5px;color:var(--mut)}
.status b{font-weight:500;color:var(--ink)}
.bar{flex:1 1 200px;min-width:160px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px;
          background:linear-gradient(90deg,var(--sky),var(--teal))}

/* ---- feed powtórkowy ---- */
.feedlink{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin:22px 0 0;
          background:var(--card);border:1px solid var(--line);border-left:3px solid var(--teal);
          border-radius:2px;padding:14px 18px;text-decoration:none;color:inherit;
          transition:border-color .15s ease,transform .12s ease,background .15s ease}
.feedlink .fl-t{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--teal)}
.feedlink .fl-t::after{content:" →";font-weight:500}
.feedlink .fl-d{font-size:15px;line-height:1.5;color:var(--mut);flex:1 1 320px}
.feedlink:hover,.feedlink:focus-visible{background:#fff;border-color:var(--teal);outline:none;transform:translateX(2px)}

/* ---- panel komisji ---- */
.panel{margin:30px 0 0;background:var(--card);border:1px solid var(--line);
       border-left:3px solid var(--violet);border-radius:2px;padding:16px 18px}
.panel .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
            color:var(--mut);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel .lbl button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
      color:var(--mut);background:none;border:1px solid var(--line);border-radius:2px;
      padding:3px 8px;cursor:pointer}
.panel .lbl button:hover{color:var(--ink);border-color:var(--ink)}
.people{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}
.person{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;
        border:1px solid var(--line);background:#F4F2EA;border-radius:2px;padding:5px 10px;
        cursor:pointer;user-select:none;transition:border-color .12s ease,background .12s ease}
.person:hover{border-color:var(--mut)}
.person input{appearance:none;width:9px;height:9px;border:1px solid var(--mut);border-radius:1px;margin:0}
.person.on{background:rgba(122,79,208,.10);border-color:var(--violet);color:var(--ink)}
.person.on input{background:var(--violet);border-color:var(--violet)}
.person .cnt{color:var(--mut);font-size:11px}
.verdict{font-family:var(--mono);font-size:12.5px;color:var(--mut);margin:14px 0 0;line-height:1.6}
.verdict b{color:var(--violet);font-weight:500}
.todo{font-family:var(--mono);font-size:11.5px;color:var(--amber);margin:10px 0 0}

/* ---- spis przedmiotów ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0;padding:0;list-style:none}
.chips a{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
         text-transform:uppercase;color:var(--mut);text-decoration:none;
         border:1px solid var(--line);background:var(--card);border-radius:2px;padding:6px 10px}
.chips a:hover,.chips a:focus-visible{color:var(--ink);border-color:var(--ink);outline:none}
.chips a .c{color:var(--violet)}

/* ---- przedmioty ---- */
section{margin-top:52px;scroll-margin-top:calc(var(--bar-h,56px) + 14px)}
h2{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:-.015em;
   margin:0 0 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 .num{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--violet);
        letter-spacing:.1em;text-transform:uppercase;flex:none}
h2 .cnt{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--mut);
        letter-spacing:.06em;margin-left:auto;flex:none}
.lead{font-size:15.5px;line-height:1.55;color:var(--mut);margin:0 0 12px;max-width:720px}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--mut);margin:0 0 10px;
      display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.meta .who{color:var(--violet)}
.meta .who.none{color:var(--amber)}
.rail{height:5px;background:linear-gradient(90deg,var(--sky) 0%,var(--teal) 30%,var(--violet) 62%,var(--amber) 100%);
      opacity:.85;margin:0 0 18px;border-radius:2px}

/* ---- pozycje ---- */
.list{display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
   border-left:3px solid var(--line);border-radius:2px;padding:13px 16px;text-decoration:none;color:inherit;
   transition:opacity .15s ease,border-color .15s ease,transform .12s ease}
.q .n{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--mut);
      flex:none;width:26px;padding-top:3px;text-align:right}
.q .t{flex:1;font-size:16.5px;line-height:1.5}
.q .tt{display:block}
.q .przed{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;
          color:var(--mut);margin-top:5px}
.q .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:2px}
.q .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--mut);white-space:nowrap}
.q .who{font-family:var(--mono);font-size:10.5px;color:var(--mut);white-space:nowrap;
        display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.q .who span{border:1px solid var(--line);border-radius:2px;padding:1px 5px}
.q .who span.on{border-color:var(--violet);color:var(--violet);background:rgba(122,79,208,.08)}
.q.soon{opacity:.75}
.q.next{opacity:1;border-left-color:var(--amber);box-shadow:0 0 0 1px rgba(226,113,29,.22)}
.q.next .n,.q.next .tag{color:var(--amber)}
.q.ready{border-left-color:var(--teal)}
.q.ready .n{color:var(--teal)}
.q.ready .tag{color:var(--teal)}
.q.ready .tt{font-weight:600}
.q.ready .tt::after{content:" →";color:var(--teal);font-family:var(--disp);font-weight:500}
.q.ready:hover,.q.ready:focus-visible{background:#fff;border-color:var(--teal);outline:none;transform:translateX(2px)}

/* tryb komisji */
body.komisja .q{opacity:.38}
body.komisja .q.hit{opacity:1;border-left-color:var(--violet);box-shadow:0 0 0 1px rgba(122,79,208,.18)}
body.komisja .q.hit.ready{border-left-color:var(--teal)}
body.komisja section.dim h2,body.komisja section.dim .meta{opacity:.45}
.hitmark{display:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
         text-transform:uppercase;color:var(--violet)}
body.komisja .q.hit .hitmark{display:block}

/* ---- przyklejony pasek nawigacji ---- */
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.topbar{position:sticky;top:0;z-index:30;background:rgba(238,241,246,.95);
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-in{max-width:960px;margin:0 auto;padding:8px 22px 7px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.tb-brand{display:flex;align-items:center;gap:9px;flex:none;text-decoration:none;color:var(--ink);
          font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.01em}
.tb-brand img{width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
.topbar .chips{order:3;flex:1 0 100%;min-width:0;margin:0;flex-wrap:nowrap;overflow-x:auto;position:relative;
               scrollbar-width:none;gap:6px;padding:2px 0;
               -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent);
               mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent)}
.topbar .chips::-webkit-scrollbar{display:none}
.topbar .chips a{white-space:nowrap;padding:5px 9px;font-size:11px}
.topbar .chips a.active{color:var(--ink);border-color:var(--ink);background:#fff}
.tb-jump{display:flex;align-items:center;gap:6px;flex:none;font-family:var(--mono);font-size:11px;
         color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.tb-jump input{width:64px;font:inherit;letter-spacing:0;text-transform:none;color:var(--ink);
               background:var(--card);border:1px solid var(--line);border-radius:2px;padding:5px 7px}
.tb-jump input:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.tb-jump input.bad{border-color:var(--rose)}
.tb-ctl{display:flex;align-items:center;gap:12px;flex:none;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
            background:var(--card);border:0;padding:6px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.betatoggle{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
            letter-spacing:.04em;color:var(--mut);cursor:pointer;user-select:none;white-space:nowrap}
.betatoggle input{appearance:none;-webkit-appearance:none;width:13px;height:13px;margin:0;display:grid;
                  place-content:center;border:1px solid var(--mut);border-radius:2px;background:var(--card)}
.betatoggle input:checked{background:var(--violet);border-color:var(--violet)}
.betatoggle input:checked::after{content:"";width:7px;height:3.5px;border:solid #fff;border-width:0 0 1.5px 1.5px;
                                 transform:rotate(-45deg) translate(1px,-1px)}
.betatoggle input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.betatoggle input:checked + span{color:var(--ink)}
.betatoggle i{font-style:normal;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);
              border:1px solid var(--amber);border-radius:2px;padding:1px 4px}

/* widok wg numeru */
#cats[hidden],#flat[hidden]{display:none}
#flat{margin-top:30px}
#flat > .lead{margin:0 0 6px}
body.by-num .topbar .chips{display:none}
.q{scroll-margin-top:calc(var(--bar-h,56px) + 18px)}
.q .kat{display:none}
body.by-num .q .kat{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--mut);margin-top:2px}
.q.flash{animation:qflash 1.7s ease}
@keyframes qflash{0%,55%{box-shadow:0 0 0 3px rgba(76,125,240,.5)}100%{box-shadow:0 0 0 0 rgba(76,125,240,0)}}

/* skład komisji = beta: domyślnie schowany */
body:not(.show-beta) .panel,
body:not(.show-beta) .beta-only,
body:not(.show-beta) .hitmark,
body:not(.show-beta) .meta .who,
body:not(.show-beta) .q .side .who{display:none !important}

@media (max-width:760px){
  .tb-in{padding:7px 16px 6px}
  .tb-ctl{gap:10px}
  .tb-jump{display:none}
}
@media (max-width:520px){
  .tb-brand span{display:none}
}

footer{margin-top:70px;padding-top:20px;border-top:1px solid var(--line);
       font-family:var(--mono);font-size:12px;color:var(--mut);line-height:1.7}

@media (max-width:680px){
  body{font-size:16px}
  header{padding-top:40px}
  h2 .cnt{display:none}
  .q{padding:12px 13px;gap:10px}
  .q .side .who{display:none}
  .q .side{flex-direction:row}
}
</style>
</head>
<body>
<nav class="topbar" id="topbar" aria-label="Nawigacja po repetytorium">
  <div class="tb-in">
    <a class="tb-brand" href="#top" title="Na górę"><img src="assets/meowl-wide.png" width="28" height="28" alt=""><span>Repetytorium</span></a>
    <ul class="chips" id="chips" aria-label="Kategorie"></ul>
    <form class="tb-jump" id="jump" role="search" aria-label="Przejdź do pytania o numerze">
      <label for="jumpN">nr</label><input id="jumpN" type="number" min="1" max="99" inputmode="numeric" placeholder="1&ndash;50">
    </form>
    <div class="tb-ctl">
      <div class="seg" role="group" aria-label="Sortowanie pytań">
        <button type="button" data-sort="stage" aria-pressed="true" title="Pytania pogrupowane w kategorie">Kategorie</button>
        <button type="button" data-sort="num" aria-pressed="false" title="Wszystkie pytania wg numeru">Numer</button>
      </div>
      <label class="betatoggle" title="Funkcja eksperymentalna: filtrowanie pytań wg składu komisji">
        <input type="checkbox" id="betaToggle"><span>komisja</span><i>beta</i>
      </label>
    </div>
  </div>
</nav>
<div class="wrap" id="top">

<header>
  <div class="masthead">
    <div class="mh-text">
      <h1>Repetytorium</h1>
    </div>
    <figure class="mh-meowls">
      <img src="assets/meowl-banner.png" width="650" height="362" decoding="async" fetchpriority="high"
           alt="Trzy meowle, czyli koty z ciałem sowy, siedzące na drewnianej belce: pręgowany z kwiatkiem, ten z wielkimi oczami i biały ze zmrużonymi oczami">
    </figure>
  </div>

  <a class="feedlink" href="feed_powtorki.html">
    <span class="fl-t">Feed powtórkowy</span>
  </a>

  <div class="panel">
    <div class="lbl">
      <span>Skład komisji</span>
      <button id="clear" type="button">wyczyść</button>
    </div>
    <div class="people" id="people"></div>
    <p class="verdict" id="verdict">Nikt nie zaznaczony — widok pełnej listy.</p>
    <p class="todo" id="todo"></p>
  </div>

</header>

<main id="cats"></main>
<div id="flat" class="list" hidden></div>
</div>

<script src="assets/pytania.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   1. WYKŁADOWCY
   Klucz → { name: pełne nazwisko, short: etykieta na tagu }
   Skład Katedry Inteligentnych Systemów Sterowania i Wspomagania Decyzji
   (eia.pg.edu.pl) + osoby znane z materiałów wykładowych.
   ══════════════════════════════════════════════════════════════════════ */
const PEOPLE = {
  grochowski:  {name:"dr hab. inż. Michał Grochowski, prof. PG", short:"Grochowski"},
  duzinkiewicz:{name:"dr hab. inż. Kazimierz Duzinkiewicz, prof. PG", short:"Duzinkiewicz"},
  puchalski:   {name:"dr inż. Bartosz Puchalski", short:"Puchalski"},
  piotrowski:  {name:"dr hab. inż. Robert Piotrowski, prof. PG", short:"Piotrowski"},
  tarnawski:   {name:"dr hab. inż. Jarosław Tarnawski, prof. PG", short:"Tarnawski"},
  rutkowski:   {name:"dr inż. Tomasz Rutkowski", short:"Rutkowski"},
  dzwonkowski: {name:"dr inż. Ariel Dzwonkowski", short:"Dzwonkowski"},
  zawalich:    {name:"dr inż. Jacek Zawalich", short:"Zawalich"},
  /* pozostali z Katedry ISSiWD, gdyby weszli do komisji — wystarczy odkomentować:
  langowski: {name:"dr inż. Rafał Łangowski", short:"Łangowski"},
  zubowicz:  {name:"dr inż. Tomasz Zubowicz", short:"Zubowicz"},   */
};

/* ══════════════════════════════════════════════════════════════════════
   2. PRZEDMIOTY
   Źródło wykładowców i semestru dla pytań; przypisanie pytanie → przedmiot
   siedzi w polu `p` każdej pozycji w KATEGORIE poniżej.
   ══════════════════════════════════════════════════════════════════════ */
const PRZEDMIOTY = {
  mid: {name:"Modelowanie i identyfikacja", short:"modelowanie i identyfikacja", sem:"sem. 1 · kierunkowy", teachers:["duzinkiewicz","grochowski","puchalski"]},
  ts: {name:"Teoria sterowania", short:"teoria sterowania", sem:"sem. 1 · kierunkowy", teachers:["duzinkiewicz","piotrowski"]},
  opt: {name:"Metody optymalizacji", short:"metody optymalizacji", sem:"sem. 1 · kierunkowy", teachers:[]},
  msi: {name:"Metody sztucznej inteligencji", short:"metody sztucznej inteligencji", sem:"sem. 1 · kierunkowy", teachers:[]},
  cps: {name:"Cyfrowe przetwarzanie sygnałów", short:"cyfrowe przetwarzanie sygnałów", sem:"sem. 2 · kierunkowy", teachers:["dzwonkowski"]},
  sas: {name:"Struktury i algorytmy sterowania", short:"struktury i algorytmy sterowania", sem:"sem. 2 · specjalność", teachers:["rutkowski"]},
  kss: {name:"Komputerowe systemy sterowania i wspomagania decyzji", short:"komputerowe systemy sterowania", sem:"sem. 2 · specjalność · KSSiWD", teachers:["tarnawski"]},
  sswd: {name:"Systemy sterowania i wspomagania decyzji", short:"systemy wspomagania decyzji", sem:"sem. 1 i 2 · kierunkowy + specjalność", teachers:["piotrowski","duzinkiewicz"]},
  mid2: {name:"Monitorowanie i diagnostyka w systemach sterowania", short:"monitorowanie i diagnostyka", sem:"sem. 2 · specjalność", teachers:["grochowski"]},
  siw: {name:"Systemy inżynierii wiedzy", short:"systemy inżynierii wiedzy", sem:"sem. 2 · specjalność", teachers:["rutkowski"]},
  app: {name:"Automatyka procesów przemysłowych", short:"automatyka procesów przemysłowych", sem:"sem. 3 · kierunkowy", teachers:["zawalich"]},
};



/* ══════════════════════════════════════════════════════════════════════
   3. RENDEROWANIE
   ══════════════════════════════════════════════════════════════════════ */
const pad = n => String(n).padStart(2,"0");
const slug = s => s.toLowerCase().replace(/[ąàá]/g,"a").replace(/ć/g,"c").replace(/ę/g,"e")
                   .replace(/ł/g,"l").replace(/ń/g,"n").replace(/[óò]/g,"o").replace(/ś/g,"s")
                   .replace(/[żź]/g,"z").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("komisja")||"[]"); }catch(e){ return []; } },
  set(v){ try{ localStorage.setItem("komisja", JSON.stringify(v)); }catch(e){} }
};

const cats = document.getElementById("cats");
const chips = document.getElementById("chips");
let total = 0, done = 0;
const rows = [];           // {el, who:[klucze], sec}
const counts = {};         // klucz wykładowcy → liczba pytań

let kolejka = 0;                       // numer w kolejce opracowań (tylko pozycje bez pliku)

KATEGORIE.forEach((et,si) => {
  const id = "e-" + slug(et.name);
  const ready = et.items.filter(i => i.file).length;
  total += et.items.length;
  done  += ready;

  const li = document.createElement("li");
  li.innerHTML = `<a href="#${id}">${et.name}</a>`;
  chips.appendChild(li);

  const przed = [...new Set(et.items.map(i => PRZEDMIOTY[i.p].name))];
  const osoby = [...new Set(et.items.flatMap(i => i.who || PRZEDMIOTY[i.p].teachers))];
  const who = osoby.length
      ? `<span class="who">${osoby.map(k => PEOPLE[k].short).join(" · ")}</span>`
      : `<span class="who none">wykładowcy do uzupełnienia</span>`;

  const sec = document.createElement("section");
  sec.id = id;
  sec.innerHTML =
    `<h2>${et.name}</h2>` +
    `<p class="meta beta-only">${who}</p>` +
    `<div class="rail"></div><div class="list"></div>`;
  const list = sec.querySelector(".list");

  et.items.forEach(q => {
    const P = PRZEDMIOTY[q.p];
    const keys = q.who || P.teachers;
    keys.forEach(k => counts[k] = (counts[k]||0) + 1);
    const el = document.createElement(q.file ? "a" : "div");
    el.className = "q " + (q.file ? "ready" : "soon");
    el.dataset.n = q.n;
    if (q.file) el.href = q.file;
    let tag;
    if (q.file) { tag = ""; }
    else {
      kolejka++;
      tag = kolejka === 1 ? "następne w kolejce" : "w kolejce &middot; " + pad(kolejka);
      if (kolejka === 1) el.classList.add("next");
    }
    el.innerHTML =
      `<span class="n">${pad(q.n)}</span>` +
      `<span class="t"><span class="tt">${q.t}</span><span class="przed">${P.short}</span><span class="kat">${et.name}</span></span>` +
      `<span class="side"><span class="tag">${tag}</span>` +
      `<span class="hitmark">komisja</span>` +
      `<span class="who">${keys.map(k=>`<span data-k="${k}">${PEOPLE[k].short}</span>`).join("")}</span></span>`;
    list.appendChild(el);
    rows.push({el, who:keys, sec, n:q.n, list});
  });

  cats.appendChild(sec);
});


let betaOn = false;   // skład komisji: funkcja beta, domyślnie wyłączona

/* ---- panel komisji ---- */
const peopleBox = document.getElementById("people");
const verdict = document.getElementById("verdict");
const selected = new Set(store.get());

Object.keys(PEOPLE).forEach(k => {
  const lab = document.createElement("label");
  lab.className = "person";
  lab.innerHTML = `<input type="checkbox" data-k="${k}"><span>${PEOPLE[k].short}</span>` +
                  `<span class="cnt">${counts[k]||0}</span>`;
  peopleBox.appendChild(lab);
});

function apply(){
  document.body.classList.toggle("komisja", betaOn && selected.size > 0);
  let hits = 0, hitsReady = 0;
  const perSection = new Map();
  rows.forEach(r => {
    const hit = r.who.some(k => selected.has(k));
    r.el.classList.toggle("hit", hit);
    r.el.querySelectorAll(".who span").forEach(s =>
      s.classList.toggle("on", selected.has(s.dataset.k)));
    if (hit){ hits++; if (r.el.classList.contains("ready")) hitsReady++; }
    perSection.set(r.sec, (perSection.get(r.sec)||0) + (hit?1:0));
  });
  perSection.forEach((n, sec) => sec.classList.toggle("dim", betaOn && selected.size>0 && n===0));
  peopleBox.querySelectorAll("input").forEach(i =>
    i.parentElement.classList.toggle("on", selected.has(i.dataset.k)));

  if (!selected.size){
    verdict.textContent = "Nikt nie zaznaczony — widok pełnej listy.";
  } else {
    const names = [...selected].map(k => PEOPLE[k].short).join(", ");
    verdict.innerHTML = `Komisja: ${names} &nbsp;·&nbsp; w zasięgu <b>${hits}</b> z ${total} zagadnień, ` +
      `z czego opracowanych <b>${hitsReady}</b>. Pozostałe pytania są przygaszone.`;
  }
  store.set([...selected]);
}

peopleBox.addEventListener("change", e => {
  const k = e.target.dataset.k;
  if (!k) return;
  e.target.checked ? selected.add(k) : selected.delete(k);
  apply();
});
document.getElementById("clear").addEventListener("click", () => {
  selected.clear();
  peopleBox.querySelectorAll("input").forEach(i => i.checked = false);
  apply();
});

peopleBox.querySelectorAll("input").forEach(i => { if (selected.has(i.dataset.k)) i.checked = true; });
apply();

/* ---- ile przedmiotów czeka na obsadę ---- */
const missing = Object.values(PRZEDMIOTY).filter(p => !p.teachers.length).map(p => p.name);
if (missing.length){
  document.getElementById("todo").textContent =
    "Do uzupełnienia obsada wykładów: " + missing.join(" · ");
}
/* ---- pasek nawigacji: wysokość, sortowanie, beta, skok do numeru, scroll-spy ---- */
const bar  = document.getElementById("topbar");
const flat = document.getElementById("flat");
const setBarH = () => document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
setBarH(); addEventListener("resize", setBarH);

const pref = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

/* sortowanie: kategorie (kolejność nauki) albo numer pytania */
const segBtns = [...document.querySelectorAll(".seg button")];
function setSort(mode, scroll){
  const num = mode === "num";
  document.body.classList.toggle("by-num", num);
  cats.hidden = num; flat.hidden = !num;
  if (num) rows.slice().sort((a, b) => a.n - b.n).forEach(r => flat.appendChild(r.el));
  else     rows.forEach(r => r.list.appendChild(r.el));
  segBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sort === mode)));
  pref.set("sort", mode);
  if (scroll){
    const top = (num ? flat : cats).getBoundingClientRect().top + scrollY - bar.offsetHeight - 14;
    if (scrollY > top) window.scrollTo({top});
  }
  spy(true);
}
segBtns.forEach(b => b.addEventListener("click", () => setSort(b.dataset.sort, true)));

/* skład komisji = beta */
const betaBox = document.getElementById("betaToggle");
function setBeta(on){
  betaOn = on; betaBox.checked = on;
  document.body.classList.toggle("show-beta", on);
  pref.set("beta", on ? "1" : "0");
  apply(); setBarH();
}
betaBox.addEventListener("change", () => setBeta(betaBox.checked));

/* skok do numeru */
const jumpN = document.getElementById("jumpN");
document.getElementById("jump").addEventListener("submit", e => {
  e.preventDefault();
  const r = rows.find(r => r.n === parseInt(jumpN.value, 10));
  if (!r){ jumpN.classList.add("bad"); setTimeout(() => jumpN.classList.remove("bad"), 900); return; }
  r.el.scrollIntoView({block:"center"});
  r.el.classList.remove("flash"); void r.el.offsetWidth; r.el.classList.add("flash");
  setTimeout(() => r.el.classList.remove("flash"), 1800);
  jumpN.select();
});

/* podświetlenie bieżącego kategorii na pasku */
const secs  = [...cats.querySelectorAll("section")];
const links = [...chips.querySelectorAll("a")];
let active = -2, tick = false;
function spy(force){
  if (document.body.classList.contains("by-num")) return;
  const line = bar.offsetHeight + 40;
  let idx = -1;
  secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= line) idx = i; });
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) idx = secs.length - 1;
  if (idx === active && !force) return;
  active = idx;
  links.forEach((a, i) => { a.classList.toggle("active", i === idx); i === idx ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current"); });
  const a = links[idx];
  if (a) chips.scrollTo({left: a.offsetLeft - (chips.clientWidth - a.offsetWidth) / 2});
}
addEventListener("scroll", () => {
  if (tick) return; tick = true;
  requestAnimationFrame(() => { tick = false; spy(); });
}, {passive:true});

setBeta(pref.get("beta", "0") === "1");
setSort(pref.get("sort", "stage") === "num" ? "num" : "stage", false);
</script>
